[versions]
sqlite-jdbc = "3.48.0.0"
exposed = "0.59.0"
h2 = "2.2.224"
kotlin = "2.1.0"
#kotlin = "2.3.0"
kotlinx-datetime = "0.6.1"
kotlinx-serialization-json = "1.7.2"
kotlinx-coroutines = "1.8.1"
javafx = "22"
javafx-plugin = "0.0.14"
gluonfx-plugin = "1.0.28"
proguard = "7.1.0"
controlsfx = "11.1.2"
ikonli = "12.4.0"
slf4j = "2.0.16"
logback = "1.5.16"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-javafx = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-javafx", version.ref = "kotlinx-coroutines" }
controlsfx = { module = "org.controlsfx:controlsfx", version.ref = "controlsfx" }
ikonli-materialdesign = { module = "org.kordamp.ikonli:ikonli-materialdesign-pack", version.ref = "ikonli" }
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-datetime = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
#h2 = { module = "com.h2database:h2", version.ref = "h2" }
proguard-gradle = { group = "com.guardsquare", name = "proguard-gradle", version.ref = "proguard" }
slf4j_api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback_classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Libraries can be bundled together for easier import
[bundles]
kotlinx-ecosystem = ["kotlinx-datetime", "kotlinx-serialization-json", "kotlinx-coroutines-core"]
ikonli = ["ikonli-materialdesign", "ikonli-javafx"]

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
javafx-gradle = { id = "org.openjfx.javafxplugin", version.ref = "javafx-plugin" }
gluonfx-gradle = { id = "com.gluonhq.gluonfx-gradle-plugin", version.ref = "gluonfx-plugin" }
proguard-gradle = { id = "com.guardsquare.proguard", version.ref = "proguard" }